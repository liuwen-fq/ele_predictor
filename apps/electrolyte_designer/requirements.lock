# Electrolyte Designer runtime lock
#
# Target: Linux x86_64, CPython 3.11, CPU inference.
# This file pins the dependency resolution used for the frozen-demo environment.
# It intentionally does not include development tools or training-only packages.
# PyTorch is installed first from requirements.torch-cpu.lock.  Keeping the
# PyTorch index out of this file prevents pip from querying that index for
# every ordinary PyPI dependency.  Recreate and validate both locks when
# upgrading the base image, Python, model artifacts, or PyTorch.
--index-url https://pypi.org/simple

